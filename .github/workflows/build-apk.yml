name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack current game source safely
        shell: bash
        run: |
          set -euo pipefail
          test -s LastCampfire.zip
          mkdir -p extracted
          unzip -q LastCampfire.zip -d extracted
          for file in package.json capacitor.config.json www/index.html www/js/game.js www/js/net.js tools/patch_android.py tools/android/LanCore.java tools/android/LanNetPlugin.java tools/debug.keystore resources/icon.png; do
            test -s "extracted/$file" || { echo "::error::Missing archive file: $file"; exit 1; }
          done
          cp -a extracted/www extracted/tools extracted/resources extracted/package.json extracted/capacitor.config.json .
          test -f .github/workflows/build-apk.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Check JavaScript syntax
        run: |
          node --check www/js/game.js
          node --check www/js/net.js
          node --check www/js/audio.js
          node --check www/js/sprites.js

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Correct Android LAN plugin SDK import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/android/LanNetPlugin.java")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              "import android.net.wifi.DhcpInfo;",
              "import android.net.DhcpInfo;"
          )
          if "import android.net.DhcpInfo;" not in source:
              raise SystemExit("DhcpInfo import was not corrected")
          path.write_text(source, encoding="utf-8")
          PY

      - name: Patch Android (landscape, fullscreen, icon, signing, LAN plugin)
        run: python3 tools/patch_android.py

      - name: Sync web files and native plugins
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Last-Campfire-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
