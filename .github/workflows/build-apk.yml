name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack game source
        run: |
          test -f LastCampfire.zip
          unzip -q LastCampfire.zip
          test -f LastCampfire/package.json
          test -f LastCampfire/capacitor.config.json
          test -f LastCampfire/tools/patch_android.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools, platforms;android-35, build-tools;35.0.0'

      - name: Install dependencies
        working-directory: LastCampfire
        run: npm install

      - name: Create Android project
        working-directory: LastCampfire
        run: npx cap add android

      - name: Patch Android (landscape, fullscreen, icon, signing)
        working-directory: LastCampfire
        run: python3 tools/patch_android.py

      - name: Sync web files
        working-directory: LastCampfire
        run: npx cap sync android

      - name: Build debug APK
        working-directory: LastCampfire/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Last-Campfire-APK
          path: LastCampfire/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
